<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Grade horária, recursos e conteúdos multimídia do módulo de Programação Web">
    <meta name="keywords" content="html, tabela, lista, video, legenda, iframe, sandbox">
    <meta name="robots" content="index,follow">
    <meta name="author" content="Karoline Carregal Rangel Chagas">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Horária de Aulas do Módulo</title>
</head>
<body>

    <!-- MÓDULO 5: HORÁRIOS DAS AULAS -->
    <div class="bloco-cronograma">
        <h2 class="titulo-seccao">Horários acadêmicos</h2>
        <table border="1">
            <caption>Grade horária das aulas do módulo</caption>
            <thead>
                <tr>
                    <th scope="col">Aula</th>
                    <th scope="col">Horário</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Estruturação Multimídia</th>
                    <td>19:00 - 20:30</td>
                </tr>
            </tbody>
        </table>

        <p>Recursos necessários:</p>
        <ul>
            <li>Computador com IDE configurada</li>
            <li>Arquivos de legenda (.vtt) prontos</li>
        </ul>
    </div>

    <hr>

    <!-- MÓDULO 6: CONTEÚDO INTEGRADO -->
    <div class="bloco-video">
        <h2>Apresentação da Disciplina</h2>
        <video controls width="640" height="360">
            <source src="apresentacao.mp4" type="video/mp4">
            <track src="legendas-pt.vtt" kind="captions" srclang="pt" label="Português" default>
            Seu navegador não suporta a reprodução de vídeos.
        </video>
    </div>

    <div class="bloco-mapa">
        <h2>Localização do Campus IFF</h2>
        <iframe src="https://mapas.iff.edu.br"
                title="Mapa com a localização do Campus IFF"
                sandbox="allow-scripts"
                width="600" height="400"
                loading="lazy"></iframe>
    </div>

</body>
</html>
