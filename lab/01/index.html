<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Exemplo formulario para busca no google">
    <meta name="keywords" content="html, formulario, google">
    <meta name="robots" content="index,follow">
    <meta name="author" content="Karoline Carregal Rangel Chagas">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador google</title>
</head>
<body>
    <nav>
        <a href="../../index.html">⬅ Voltar ao Portfólio Central</a>
    </nav>

    <hr>

    <form action="https://www.google.com/search" method="get">
        <label for="pesquisar">Pesquisar no Google:</label>
        <input type="search" name="q" id="pesquisar" placeholder="Pesquisar no google">
        <input type="submit" name="name" value="buscar">
        <input type="reset" value="limpar">
    </form>
</body>
</html>
