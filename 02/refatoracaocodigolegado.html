<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrir Chamado Técnico</title>
</head>
<body>
  <form class="box-suporte" action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
    <fieldset>
      <legend>Abrir Chamado Técnico</legend>

      <div class="campo">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="campo">
        <label for="email">E-mail de Contato:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="campo">
        <label for="prioridade">Prioridade:</label>
        <select id="prioridade" name="prioridade" required>
          <option value="">Selecione...</option>
          <option value="Baixa">Baixa</option>
          <option value="Média">Média</option>
          <option value="Alta">Alta</option>
        </select>
      </div>

      <div class="campo">
        <label for="anexo">Arquivo de Log ou Print:</label>
        <input type="file" id="anexo" name="anexo"
               accept="image/png,application/pdf"
               aria-describedby="anexo-ajuda">
        <small id="anexo-ajuda">Formatos aceitos: PNG ou PDF.</small>
      </div>

      <button type="submit" class="botao">Enviar Chamado</button>
    </fieldset>
  </form>
</body>
</html>
