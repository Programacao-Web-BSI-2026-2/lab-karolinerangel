<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Exemplo de estruturação de tabelas em HTML">
    <meta name="keywords" content="html, tabela, table, thead, tbody">
    <meta name="robots" content="index,follow">
    <meta name="author" content="Karoline Carregal Rangel Chagas">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 03</title>
</head>
<body>
    <nav>
        <a href="../../index.html">⬅ Voltar ao Portfólio Central</a>
    </nav>

    <hr>

    <main>
        <h1>Lab 03 - Tabelas</h1>
        <table border="1">
            <thead>
                <tr>
                    <th>Tag</th>
                    <th>Função</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>&lt;table&gt;</td>
                    <td>Cria a tabela</td>
                </tr>
                <tr>
                    <td>&lt;tr&gt;</td>
                    <td>Cria uma linha</td>
                </tr>
                <tr>
                    <td>&lt;th&gt;</td>
                    <td>Célula de cabeçalho</td>
                </tr>
                <tr>
                    <td>&lt;td&gt;</td>
                    <td>Célula de dados</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
